name: Update public IPO snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-ipo-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:update
      - name: Commit changed public data
        run: |
          git config user.name "ipo-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current-ipo-backup.json data/closed-ipo-backup.json data/ipo-snapshot-meta.json
          git diff --cached --quiet || git commit -m "chore: refresh public IPO snapshot"
          git push
